<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable · Agios</title>
<style>
  :root { --creme:#F6F1E7; --sapin:#17332B; --brique:#D9542B; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--creme); color:var(--sapin); font:18px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px; }
  .box { max-width:420px; }
  h1 { font-family:Georgia,serif; font-size:64px; margin-bottom:8px; }
  p { margin-bottom:28px; opacity:.85; }
  a.btn { display:inline-block; background:var(--brique); color:#fff; text-decoration:none; font-weight:700;
          padding:16px 28px; border-radius:10px; }
</style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <p>Cette page n'existe pas ou a été déplacée.</p>
    <a class="btn" href="/">Retour à l'accueil</a>
  </div>
</body>
</html>
